# Pings the API every 10 minutes so Render's free instance does not go to sleep
# (it sleeps after 15 minutes without traffic and then takes ~1 minute to wake).
# Set the repository secret API_HEALTH_URL to https://<your-service>.onrender.com/api/health
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL secret is not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors "$API_HEALTH_URL"
      # Releases stock held by online orders that were never paid (the API also does this every 2 minutes
      # while awake). Needs the CRON_SECRET repository secret, same value as on Render.
      - name: Run scheduled jobs
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_HEALTH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_HEALTH_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST -H "x-cron-secret: $CRON_SECRET" "${API_HEALTH_URL%/health}/internal/jobs"
