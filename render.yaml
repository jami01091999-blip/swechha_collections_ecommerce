# Render Blueprint: the Express API (server/). The React client is deployed separately on Vercel.
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied, and they are
# never stored in this file.
services:
  - type: web
    name: swechha-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # Installs from server/package-lock.json (server/ is a standalone package).
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: test
      - key: LOG_LEVEL
        value: info
      - key: MONGO_DB
        value: swechha
      - key: CLOUDINARY_FOLDER
        value: swechha/products
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: ACCESS_TOKEN_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_DAYS
        value: '30'
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Commerce (Phases 3–8)
      - key: SHIPPING_PROVIDER
        value: manual
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SITE_URL
        sync: false
